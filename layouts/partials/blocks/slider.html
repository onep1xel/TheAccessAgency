<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

<div class="relative px-4 sm:px-6 lg:px-8
  {{ if eq .padding "top" }}pt-20 lg:pt-24{{ else if eq .padding "bottom" }}pb-20 lg:pb-24{{ else }}py-20 lg:py-24{{ end }}
  {{ if eq .color "light" }}text-white {{ else if eq .color "muted" }}text-sand-regular{{ else }}text-whale-regular{{ end }}"{{ with .background }} style="background: {{ . }}"{{ end }}>
  <div class="mx-auto max-w-3xl {{ if eq .layout "vertical" }}lg:max-w-6xl{{ else }}lg:max-w-6xl{{ end }}">
    <style scoped>
      @media (min-width: 1024px) {
        .offset { margin-top: {{ .offset | default "0" }} };
      }
    </style>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16">
      <div>
        <div class="swiper w-full-">
          <div class="swiper-wrapper">
            {{ range .slides }}
              <div class="swiper-slide">
                <img class="w-full" src="{{ . | absURL }}" alt="Slide" />
              </div>
            {{ end }}
          </div>
          <div class="swiper-button-next slider-media"></div>
          <div class="swiper-button-prev slider-media"></div>
        </div>

        <script>
          const swiper = new Swiper('.swiper', {
            loop: true,
            autoHeight: true,
            slidesPerView: 1,
            spaceBetween: 30,
            navigation: {
              nextEl: ".swiper-button-next",
              prevEl: ".swiper-button-prev",
            },
          });
        </script>
      </div>

      <div class="offset">
        {{ with .superheading }}
          <h2 class="text-2xl font-bold leading-tight sm:leading-none sm:text-3xl text-rose-regular mb-3">{{ . }}</h2>
        {{ end }}
        {{ with .heading }}
          <h2 class="font-serif font-semibold text-4xl sm:text-5xl leading-[1.15] sm:leading-[1.15]">{{ . }}</h2>
        {{ end }}
        {{ with .text }}
          <div class="mt-5 font-serif leading-snug sm:leading-snug text-xl sm:text-2xl">{{ . | markdownify }}</div>
        {{ end }}
        {{ with .link }}
          <div class="mt-5">
            <a href="{{ .url | relURL }}" class="inline-block font-serif text-xl sm:text-2xl underline italic font-semibold hover:opacity-80">{{ .text }}</a>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>
